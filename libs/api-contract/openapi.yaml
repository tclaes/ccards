openapi: 3.0.3
info:
  title: ccards API
  version: 0.0.1
  description: |
    Source of truth for the ccards HTTP API. Edit this file; the Java
    interfaces/DTOs (apps/api) and the TypeScript client (libs/api-client)
    are generated from it at build time.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Cards
paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness of the API
      responses:
        '200':
          description: The API is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/cards:
    get:
      tags: [Cards]
      operationId: listCards
      summary: List loyalty cards, one page at a time, favorites first
      parameters:
        - name: page
          in: query
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Number of cards per page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          description: |
            Order of the cards. Favorites come first in every order, and the
            order applies to the whole list before it is split into pages.
            `name`: by name. `lastUsed`: most recently used first, never used
            last. `mostUsed`: most uses first. Ties are ordered by name.
          schema:
            type: string
            enum: [name, lastUsed, mostUsed]
            default: name
      responses:
        '200':
          description: One page of cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Cards]
      operationId: createCard
      summary: Create a loyalty card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardInput'
      responses:
        '201':
          description: The card was created
          headers:
            Location:
              description: URL of the new card
              schema:
                type: string
                example: /api/cards/6f1c0c0e-6f0b-4f5e-9d49-0c1d5e0f8a11
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/cards/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Cards]
      operationId: getCard
      summary: Get one loyalty card
      responses:
        '200':
          description: The card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Cards]
      operationId: patchCard
      summary: Partially update a loyalty card (JSON Merge Patch, RFC 7396)
      description: |
        Fields present in the body are changed, absent fields are kept and
        `null` clears an optional field (`color`, `note`). `version` is
        required and must equal the version the client last read.
      requestBody:
        required: true
        x-codegen-request-body-name: cardPatch
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/CardPatch'
      responses:
        '200':
          description: The updated card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Cards]
      operationId: deleteCard
      summary: Delete a loyalty card
      responses:
        '204':
          description: The card was deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/cards/{id}/barcode:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Cards]
      operationId: getCardBarcode
      summary: The card's barcode as an image
      description: |
        Draws the card number as a barcode of the card's `barcodeType`. The
        `ETag` changes whenever the card or the format changes; send it back in
        `If-None-Match` to get 304 without the image. `Cache-Control: no-cache`
        lets clients store the image but requires revalidation before reuse.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [png, svg]
            default: png
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of a copy the client already has; a match gets 304 without the image
          schema:
            type: string
      responses:
        '200':
          description: The barcode image
          headers:
            ETag:
              schema:
                type: string
              description: Validator for this card version and format
            Cache-Control:
              schema:
                type: string
                example: no-cache, private
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        '304':
          description: The image is unchanged since the `ETag` sent in `If-None-Match`
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/cards/{id}/usage:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Cards]
      operationId: registerCardUsage
      summary: Register one use of the card
      description: |
        Counts one use (for example the card was shown at the till) and sets
        the last-used time to now. It is not an edit: `version`, `updatedAt`
        and the barcode `ETag` stay as they are.
      responses:
        '204':
          description: The use was registered
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/cards/{id}/favorite:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Cards]
      operationId: markCardFavorite
      summary: Mark the card as a favorite
      description: |
        Favorites come first in the card list. Marking is not an edit:
        `version`, `updatedAt` and the barcode `ETag` stay as they are.
        Repeating the request changes nothing.
      responses:
        '204':
          description: The card is a favorite
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Cards]
      operationId: unmarkCardFavorite
      summary: Remove the favorite mark from the card
      description: |
        The card itself is kept. Like marking, this is not an edit, and
        repeating the request changes nothing.
      responses:
        '204':
          description: The card is not a favorite
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    BadRequest:
      description: The request is invalid; `errors` lists every violated field
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    NotFound:
      description: The resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The resource was changed by someone else since it was read
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The request content type is not supported for this operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: The request is valid but the stored data cannot be processed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Unexpected server error; details are only in the server log
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: Problem details object (RFC 9457)
      required: [title, status]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
        instance:
          type: string
          example: /api/cards
    ValidationProblem:
      description: Problem with the violated fields (HTTP 400)
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldViolation'
    FieldViolation:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: title
        message:
          type: string
          example: must not be blank
    BarcodeType:
      type: string
      enum: [CODE_128, EAN_13, EAN_8, UPC_A, QR_CODE]
    CardInput:
      type: object
      required: [name, store, cardNumber, barcodeType]
      properties:
        name:
          type: string
          maxLength: 100
          example: Groceries
        store:
          type: string
          maxLength: 100
          example: Delhaize
        cardNumber:
          type: string
          maxLength: 100
          description: Must be valid for `barcodeType` (digits and check digit for EAN-13, EAN-8, UPC-A)
          example: '4006381333931'
        barcodeType:
          $ref: '#/components/schemas/BarcodeType'
        color:
          type: string
          maxLength: 32
          nullable: true
          example: '#ff8800'
        note:
          type: string
          maxLength: 1000
          nullable: true
    Card:
      allOf:
        - $ref: '#/components/schemas/CardInput'
        - type: object
          required: [id, version, favorite, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            favorite:
              type: boolean
              description: Changed only through `/api/cards/{id}/favorite`
            version:
              type: integer
              format: int64
              description: Send this back in `PATCH` to detect concurrent changes
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    CardPatch:
      type: object
      description: JSON Merge Patch body; the same fields as CardInput, all optional, plus the required `version`
      required: [version]
      properties:
        name:
          type: string
          maxLength: 100
        store:
          type: string
          maxLength: 100
        cardNumber:
          type: string
          maxLength: 100
        barcodeType:
          $ref: '#/components/schemas/BarcodeType'
        color:
          type: string
          maxLength: 32
          nullable: true
        note:
          type: string
          maxLength: 1000
          nullable: true
        version:
          type: integer
          format: int64
    CardPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        page:
          type: integer
          format: int32
          description: Zero-based index of this page
        size:
          type: integer
          format: int32
          description: Requested page size
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
