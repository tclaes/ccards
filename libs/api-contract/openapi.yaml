openapi: 3.0.3
info:
  title: ccards API
  version: 0.0.1
  description: |
    Source of truth for the ccards HTTP API. Edit this file; the Java
    interfaces/DTOs (apps/api) and the TypeScript client (libs/api-client)
    are generated from it at build time.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Cards
paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness of the API
      responses:
        '200':
          description: The API is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/cards:
    get:
      tags: [Cards]
      operationId: listCards
      summary: List loyalty cards, one page at a time (ordered by name)
      parameters:
        - name: page
          in: query
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Number of cards per page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/cards/{id}:
    get:
      tags: [Cards]
      operationId: getCard
      summary: Get one loyalty card
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    BadRequest:
      description: The request is invalid; `errors` lists every violated field
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    NotFound:
      description: The resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Unexpected server error; details are only in the server log
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: Problem details object (RFC 9457)
      required: [title, status]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
        instance:
          type: string
          example: /api/cards
    ValidationProblem:
      description: Problem with the violated fields (HTTP 400)
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldViolation'
    FieldViolation:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: title
        message:
          type: string
          example: must not be blank
    BarcodeType:
      type: string
      enum: [CODE_128, EAN_13, EAN_8, UPC_A, QR_CODE]
    Card:
      type: object
      required: [id, name, store, cardNumber, barcodeType, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Albert Heijn bonus card
        store:
          type: string
          example: Albert Heijn
        cardNumber:
          type: string
          example: '2620000012345'
        barcodeType:
          $ref: '#/components/schemas/BarcodeType'
        color:
          type: string
          nullable: true
          example: '#00a0e2'
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CardPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        page:
          type: integer
          format: int32
          description: Zero-based index of this page
        size:
          type: integer
          format: int32
          description: Requested page size
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
