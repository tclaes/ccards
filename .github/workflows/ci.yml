name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on PRs. Every push to main gets its own group, so no
# main commit is skipped (a shared group would cancel pending runs).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job name is the required status check on `main` (branch protection).
  # Do not rename it without updating the protection rule.
  CI:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - run: npm ci

      # Docker is preinstalled on the runner, so the Testcontainers-based
      # migration tests in `api` run instead of being skipped.
      - run: npx nx affected -t lint test build --parallel=3
