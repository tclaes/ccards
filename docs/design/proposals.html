<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccards design proposals</title>
<style>
  body { margin: 0; font-family: -apple-system, system-ui, "Segoe UI", sans-serif; background: #e9e9ee; color: #1b1f3b; }
  header.page { padding: 32px 24px 8px; max-width: 1280px; margin: 0 auto; }
  header.page h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header.page p { margin: 0; color: #55586f; }
  .logo-sheet { max-width: 1280px; margin: 16px auto; padding: 0 24px; display: flex; gap: 16px; flex-wrap: wrap; }
  .logo-sheet > div { background: #fff; border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 12px; }
  .logo-sheet svg { display: block; }
  .wordmark { font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; }

  section.proposal { max-width: 1280px; margin: 40px auto; padding: 0 24px; }
  section.proposal > h2 { margin: 0; font-size: 1.25rem; }
  section.proposal > p.lead { margin: 4px 0 16px; color: #55586f; max-width: 70ch; }
  .screens { display: flex; gap: 24px; flex-wrap: wrap; }
  .phone { width: 300px; height: 600px; border-radius: 28px; overflow: hidden; position: relative;
           background: var(--bg); color: var(--fg); font-family: var(--font); box-shadow: 0 8px 30px rgba(0,0,0,.18); display: flex; flex-direction: column; }
  .phone * { box-sizing: border-box; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 16px; }
  .bar .name { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; flex: 1; }
  .bar .back { font-size: 1.2rem; }
  .search { margin: 0 16px 12px; padding: 10px 12px; background: var(--field); border: var(--bw) solid var(--line); border-radius: var(--r); color: var(--muted); font-size: .9rem; }
  .grid { padding: 0 16px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; overflow: hidden; }
  .tile { border-radius: var(--r); height: 92px; padding: 10px; display: flex; flex-direction: column; justify-content: flex-end;
          font-weight: 700; font-size: .95rem; border: var(--bw) solid var(--tile-line); box-shadow: var(--tile-shadow); }
  .tile small { font-weight: 500; opacity: .75; font-size: .72rem; }
  .fab { margin: auto 16px 16px; padding: 14px; text-align: center; font-weight: 700; background: var(--accent); color: var(--on-accent); border-radius: var(--r); border: var(--bw) solid var(--btn-line); box-shadow: var(--btn-shadow); }
  .checkout { flex: 1; display: flex; flex-direction: column; padding: 0 16px 16px; gap: 14px; }
  .barcode-card { background: #fff; color: #000; border-radius: var(--r); padding: 18px 12px; border: var(--bw) solid var(--tile-line); text-align: center; }
  .barcode { height: 150px; display: flex; align-items: stretch; justify-content: center; gap: 0; }
  .barcode i { display: block; background: #000; }
  .num { font-family: var(--mono); letter-spacing: .12em; margin-top: 10px; font-size: .85rem; }
  .hint { text-align: center; color: var(--muted); font-size: .8rem; }
  .form { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .form label { font-size: .8rem; font-weight: 700; display: block; margin-bottom: 4px; }
  .field { background: var(--field); border: var(--bw) solid var(--line); border-radius: var(--r); padding: 11px 12px; font-size: .95rem; }
  .field.ph { color: var(--muted); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .sw { width: 34px; height: 34px; border-radius: var(--r); border: var(--bw) solid var(--tile-line); }
  .sw.on { outline: 3px solid var(--accent); outline-offset: 2px; }
  .cap { text-align: center; font-size: .75rem; color: #6a6d85; margin-top: 8px; }
  .swatch-row { display: flex; gap: 8px; margin-top: 16px; font-size: .75rem; color: #55586f; flex-wrap: wrap; }
  .swatch-row span { display: inline-flex; align-items: center; gap: 6px; background: #fff; padding: 4px 8px; border-radius: 99px; }
  .swatch-row b { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.15); }

  /* A: Paper */
  .A { --bg:#f7f7fb; --fg:#1b1f3b; --muted:#80839b; --accent:#4f46e5; --on-accent:#fff; --field:#fff; --line:#d9dae6;
       --r:10px; --bw:1px; --tile-line:transparent; --tile-shadow:0 1px 2px rgba(27,31,59,.12); --btn-line:transparent; --btn-shadow:none;
       --font:-apple-system, system-ui, "Segoe UI", sans-serif; --mono:ui-monospace, Menlo, monospace; }
  /* B: Wallet (dark) */
  .B { --bg:#12131a; --fg:#f3f4f8; --muted:#8b8fa3; --accent:#b6f24a; --on-accent:#12131a; --field:#1c1e28; --line:#2b2e3c;
       --r:20px; --bw:1px; --tile-line:transparent; --tile-shadow:none; --btn-line:transparent; --btn-shadow:none;
       --font:-apple-system, system-ui, "Segoe UI", sans-serif; --mono:ui-monospace, Menlo, monospace; }
  /* C: Counter */
  .C { --bg:#fffbea; --fg:#111; --muted:#5d5a48; --accent:#ffd60a; --on-accent:#111; --field:#fff; --line:#111;
       --r:4px; --bw:2px; --tile-line:#111; --tile-shadow:3px 3px 0 #111; --btn-line:#111; --btn-shadow:3px 3px 0 #111;
       --font:"Helvetica Neue", Arial, sans-serif; --mono:ui-monospace, Menlo, monospace; }
  .C .bar .name, .C .tile { text-transform: none; }
  .C .bar { border-bottom: 2px solid #111; margin-bottom: 14px; }
</style>
</head>
<body>
<header class="page">
  <h1>ccards: logo and 3 design proposals</h1>
  <p>Mock screens: card list, checkout (full-screen barcode), add card. Barcodes are illustrative.</p>
</header>

<div class="logo-sheet" id="logos"></div>

<div id="root"></div>

<script>
const BACK = 'M42 76V68a14 14 0 0 1 14-14H200a14 14 0 0 1 14 14V76Z';
const FRONT = 'M48 86H208a20 20 0 0 1 20 20V190a20 20 0 0 1-20 20H48a20 20 0 0 1-20-20V106A20 20 0 0 1 48 86ZM160.53 116.47A46 46 0 1 0 160.53 181.53L144.97 165.97A24 24 0 1 1 144.97 132.03Z';
const mark = (size, back, front) => `<svg width="${size}" height="${size}" viewBox="0 0 256 256" aria-hidden="true"><path fill="${back}" d="${BACK}"/><path fill="${front}" fill-rule="evenodd" d="${FRONT}"/></svg>`;

// Logo sheet
const logos = document.getElementById('logos');
logos.innerHTML = `
  <div>${mark(96,'#1b1f3b','#4f46e5')}<span class="wordmark">ccards</span></div>
  <div style="background:#12131a;color:#fff">${mark(96,'#8b8fa3','#b6f24a')}<span class="wordmark">ccards</span></div>
  <div>${mark(96,'#000','#000')}<span class="wordmark">ccards</span></div>
  <div>${mark(64,'#1b1f3b','#4f46e5')}${mark(32,'#1b1f3b','#4f46e5')}${mark(16,'#1b1f3b','#4f46e5')}<span style="color:#6a6d85;font-size:.8rem">64 / 32 / 16 px</span></div>`;

function barcode(seed) {
  let s = seed, out = '';
  for (let n = 0; n < 46; n++) { s = (s * 9301 + 49297) % 233280; const w = 1 + Math.floor(s / 233280 * 4); out += `<i style="width:${w}px;margin-right:${1 + (n % 3 === 0 ? 1 : 0)}px"></i>`; }
  return `<div class="barcode">${out}</div>`;
}

const cards = [
  ['Bakery De Zon', 'Bakker', '#ffcf5c', '#111'],
  ['Hardware Plus', '4 visits', '#4f7cff', '#fff'],
  ['Studio Lotus', 'Yoga', '#7bd3a8', '#111'],
  ['Café Noord', '8 coffees', '#ff7a6b', '#111'],
  ['Pharma Direct', 'Member', '#b79cff', '#111'],
  ['Bike Garage', 'Service', '#e8e8ef', '#111'],
];

const proposals = [
  { cls: 'A', title: 'A. Paper: light, quiet, close to the current Pico look',
    lead: 'Neutral off-white canvas, one indigo accent, system font. The coloured cards are the only colour on screen. Smallest change from what is built today.',
    back:'#1b1f3b', front:'#4f46e5', name:'ccards', colors: [['#f7f7fb','canvas'],['#1b1f3b','ink'],['#4f46e5','accent']] },
  { cls: 'B', title: 'B. Wallet: dark, soft, phone-native',
    lead: 'Dark canvas with a lime accent and large rounded cards. Barcode screen stays white for scanning. Feels like a wallet; good in dim shops.',
    back:'#8b8fa3', front:'#b6f24a', name:'ccards', colors: [['#12131a','canvas'],['#f3f4f8','text'],['#b6f24a','accent']] },
  { cls: 'C', title: 'C. Counter: bold, high contrast, utilitarian',
    lead: 'Warm paper, thick black outlines, hard shadows, square-ish corners, monospace numbers. Maximum legibility at arm\'s length at the till.',
    back:'#111', front:'#ffd60a', name:'ccards', colors: [['#fffbea','canvas'],['#111111','ink'],['#ffd60a','accent']] },
];

const root = document.getElementById('root');
for (const p of proposals) {
  const dark = p.cls === 'B';
  const tileTextFix = (c) => c;
  const bar = (inner) => `<div class="bar">${inner}</div>`;
  const list = `
    <div class="phone ${p.cls}">
      ${bar(`${mark(28, p.back, p.front)}<span class="name">ccards</span>`)}
      <div class="search">Search cards</div>
      <div class="grid">${cards.map(c => `<div class="tile" style="background:${c[2]};color:${c[3]}">${c[0]}<small>${c[1]}</small></div>`).join('')}</div>
      <div class="fab">+ Add card</div>
    </div>`;
  const checkout = `
    <div class="phone ${p.cls}">
      ${bar(`<span class="back">←</span><span class="name">Bakery De Zon</span>`)}
      <div class="checkout">
        <div class="barcode-card">${barcode(7)}<div class="num">5412 0083 9921</div></div>
        <div class="hint">Screen stays awake. Hold up to the scanner.</div>
        <div class="fab" style="margin:auto 0 0">Done</div>
      </div>
    </div>`;
  const form = `
    <div class="phone ${p.cls}">
      ${bar(`<span class="back">←</span><span class="name">New card</span>`)}
      <div class="form">
        <div><label>Name</label><div class="field">Bakery De Zon</div></div>
        <div><label>Card number</label><div class="field" style="font-family:var(--mono)">5412 0083 9921</div></div>
        <div><label>Colour</label><div class="swatches">${['#ffcf5c','#4f7cff','#7bd3a8','#ff7a6b','#b79cff','#e8e8ef'].map((c,i)=>`<div class="sw ${i===0?'on':''}" style="background:${c}"></div>`).join('')}</div></div>
        <div class="fab" style="margin:auto 0 0">Save card</div>
      </div>
    </div>`;
  root.insertAdjacentHTML('beforeend', `
    <section class="proposal">
      <h2>${p.title}</h2>
      <p class="lead">${p.lead}</p>
      <div class="screens">
        <div>${list}<div class="cap">Card list</div></div>
        <div>${checkout}<div class="cap">Checkout</div></div>
        <div>${form}<div class="cap">Add card</div></div>
      </div>
      <div class="swatch-row">${p.colors.map(c => `<span><b style="background:${c[0]}"></b>${c[1]} ${c[0]}</span>`).join('')}</div>
    </section>`);
}
</script>
</body>
</html>
