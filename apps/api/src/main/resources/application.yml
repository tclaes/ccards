spring:
  application:
    name: api
  autoconfigure:
    # Default profile needs no database (also keeps `nx test api` Docker-free).
    # The `local` profile re-enables it; see application-local.yml.
    exclude: org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  jpa:
    hibernate:
      # Schema is owned by Flyway migrations (db/migration). Hibernate only
      # validates; never use `update`/`create`: no history, not reviewable.
      ddl-auto: validate

server:
  port: 8080

springdoc:
  # Swagger UI renders libs/api-contract/openapi.yaml (contract-first), copied
  # to static/api-docs at build time, not a spec scanned from controllers.
  # (api-docs.enabled=false would switch Swagger UI off too.)
  swagger-ui:
    path: /swagger-ui
    url: /api-docs/openapi.yaml

management:
  endpoints:
    web:
      # Actuator lives under /api, so health is served at /api/health.
      base-path: /api
      # No Actuator index page at GET /api; only /api/health is served.
      discovery:
        enabled: false
      exposure:
        include: health
  health:
    # A missing SMTP server must never turn /api/health DOWN.
    mail:
      enabled: false
  endpoint:
    health:
      show-details: never
      # Boot 4 enables liveness/readiness groups by default, which adds a
      # "groups" field to the response. Off until we deploy to a platform
      # that uses probes (CC-37).
      probes:
        enabled: false
