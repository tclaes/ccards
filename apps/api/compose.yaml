# Local development stack: PostgreSQL + Mailpit (SMTP sink with web UI).
# Development credentials only. Ports are bound to loopback.
# Override any value with a .env file next to this file (see .env.example).
name: ccards

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ccards}
      POSTGRES_USER: ${POSTGRES_USER:-ccards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ccards}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  postgres-data:
